<!doctype html>
<html><head><meta charset="utf-8"><title>ContinuED Architecture</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  svg{display:block;font-family:"Segoe UI",Arial,sans-serif;}
  .t{font-size:44px;font-weight:700;fill:#2b1250}
  .h{font-size:24px;font-weight:700;fill:#5b2a9a}
  .b{font-size:19px;fill:#1f1f24}
  .s{font-size:16px;fill:#6b7280}
  .w{font-size:20px;font-weight:700;fill:#fff}
  .step{fill:#f4eefc;stroke:#5b2a9a;stroke-width:2.5}
  .box{fill:#fff;stroke:#5b2a9a;stroke-width:3}
  .inner{fill:#faf7ff;stroke:#cdb8ec;stroke-width:1.5}
  .plan{fill:#fff;stroke:#6b7280;stroke-width:2.5;stroke-dasharray:10 7}
  .planin{fill:#f7f7f8;stroke:#c4c4cc;stroke-width:1.5;stroke-dasharray:6 5}
  .ar{stroke:#5b2a9a;stroke-width:3.5;fill:none;marker-end:url(#a)}
  .ard{stroke:#6b7280;stroke-width:3;fill:none;stroke-dasharray:9 6;marker-end:url(#g)}
</style></head><body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5b2a9a"/></marker>
    <marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6b7280"/></marker>
  </defs>

  <text x="60" y="70" class="t">ContinuED — Process Flow &amp; Architecture</text>
  <!-- legend -->
  <rect x="1330" y="38" width="44" height="26" class="inner"/><text x="1384" y="58" class="s">Core MVP (by 26 Nov)</text>
  <rect x="1600" y="38" width="44" height="26" class="planin"/><text x="1654" y="58" class="s">Planned (hack day)</text>

  <!-- PROCESS FLOW -->
  <text x="60" y="125" class="h">1 · Process flow: input → processing → output</text>
  <g>
    <rect x="60"   y="145" width="320" height="120" rx="14" class="step"/>
    <text x="80" y="182" class="h">① CHECK</text>
    <text x="80" y="214" class="b">Old teacher marks 8 basic</text>
    <text x="80" y="240" class="b">reading &amp; maths skills</text>

    <rect x="430"  y="145" width="320" height="120" rx="14" class="step"/>
    <text x="450" y="182" class="h">② SEAL</text>
    <text x="450" y="214" class="b">Compress + tamper-evident</text>
    <text x="450" y="240" class="b">seal → small QR (~140 chars)</text>

    <rect x="800"  y="145" width="320" height="120" rx="14" class="step"/>
    <text x="820" y="182" class="h">③ CARRY</text>
    <text x="820" y="214" class="b">Paper slip or phone.</text>
    <text x="820" y="240" class="b">No name — only ID TC-4821</text>

    <rect x="1170" y="145" width="320" height="120" rx="14" class="step"/>
    <text x="1190" y="182" class="h">④ SCAN</text>
    <text x="1190" y="214" class="b">New teacher, no internet:</text>
    <text x="1190" y="240" class="b">verify seal, decode skills</text>

    <rect x="1540" y="145" width="320" height="120" rx="14" class="step"/>
    <text x="1560" y="182" class="h">⑤ TEACH</text>
    <text x="1560" y="214" class="b">Root bottleneck + "Start Here</text>
    <text x="1560" y="240" class="b">Tomorrow" in teacher's language</text>

    <path d="M382,205 L426,205" class="ar"/>
    <path d="M752,205 L796,205" class="ar"/>
    <path d="M1122,205 L1166,205" class="ar"/>
    <path d="M1492,205 L1536,205" class="ar"/>
  </g>

  <!-- ARCHITECTURE -->
  <text x="60" y="325" class="h">2 · Architecture</text>

  <!-- Phone A -->
  <rect x="60" y="345" width="640" height="440" rx="18" class="box"/>
  <rect x="60" y="345" width="640" height="56" rx="18" fill="#5b2a9a"/>
  <rect x="60" y="380" width="640" height="21" fill="#5b2a9a"/>
  <text x="84" y="382" class="w">PHONE A · Origin teacher (offline PWA)</text>
  <rect x="84"  y="420" width="290" height="96" rx="10" class="inner"/>
  <text x="100" y="452" class="h">Create screen</text><text x="100" y="480" class="b">React + TypeScript</text><text x="100" y="503" class="s">Tailwind CSS</text>
  <rect x="390" y="420" width="290" height="96" rx="10" class="inner"/>
  <text x="406" y="452" class="h">Capsule codec</text><text x="406" y="480" class="b">lz-string compression</text><text x="406" y="503" class="s">Web Crypto HMAC-SHA256 seal</text>
  <rect x="84"  y="530" width="290" height="96" rx="10" class="inner"/>
  <text x="100" y="562" class="h">Skill graph</text><text x="100" y="590" class="b">8 FLN skills + prerequisites</text><text x="100" y="613" class="s">language-agnostic</text>
  <rect x="390" y="530" width="290" height="96" rx="10" class="inner"/>
  <text x="406" y="562" class="h">QR generator</text><text x="406" y="590" class="b">qrcode.react</text><text x="406" y="613" class="s">screen or printed slip</text>
  <rect x="84"  y="640" width="290" height="126" rx="10" class="inner"/>
  <text x="100" y="672" class="h">Language packs</text><text x="100" y="700" class="b">English · मराठी · ಕನ್ನಡ</text><text x="100" y="723" class="s">bundled, no internet needed</text>
  <rect x="390" y="640" width="290" height="126" rx="10" class="planin"/>
  <text x="406" y="672" class="h">Voice pack</text><text x="406" y="700" class="b">ElevenLabs clips (cached)</text><text x="406" y="723" class="s">MVP: device voice fallback</text>
  <text x="406" y="748" class="s">Offline: PWA service worker</text>

  <!-- QR transfer -->
  <rect x="790" y="470" width="170" height="170" rx="12" fill="#fff" stroke="#1f1f24" stroke-width="3"/>
  <g fill="#1f1f24">
    <rect x="808" y="488" width="44" height="44"/><rect x="898" y="488" width="44" height="44"/><rect x="808" y="578" width="44" height="44"/>
    <rect x="818" y="498" width="24" height="24" fill="#fff"/><rect x="908" y="498" width="24" height="24" fill="#fff"/><rect x="818" y="588" width="24" height="24" fill="#fff"/>
    <rect x="824" y="504" width="12" height="12"/><rect x="914" y="504" width="12" height="12"/><rect x="824" y="594" width="12" height="12"/>
    <rect x="866" y="492" width="14" height="14"/><rect x="866" y="520" width="14" height="14"/><rect x="866" y="548" width="14" height="14"/>
    <rect x="898" y="548" width="14" height="14"/><rect x="926" y="562" width="14" height="14"/><rect x="866" y="590" width="14" height="14"/>
    <rect x="898" y="590" width="14" height="14"/><rect x="926" y="606" width="14" height="14"/><rect x="884" y="606" width="14" height="14"/>
    <rect x="812" y="548" width="14" height="14"/><rect x="840" y="548" width="14" height="14"/>
  </g>
  <text x="790" y="668" class="h">QR capsule</text>
  <text x="790" y="694" class="s">paper or phone ·</text>
  <text x="790" y="714" class="s">no internet needed</text>
  <path d="M702,555 L784,555" class="ar"/>
  <path d="M962,555 L1044,555" class="ar"/>

  <!-- Phone B -->
  <rect x="1050" y="345" width="810" height="440" rx="18" class="box"/>
  <rect x="1050" y="345" width="810" height="56" rx="18" fill="#5b2a9a"/>
  <rect x="1050" y="380" width="810" height="21" fill="#5b2a9a"/>
  <text x="1074" y="382" class="w">PHONE B · Destination teacher (offline PWA, any of the languages)</text>
  <rect x="1074" y="420" width="370" height="96" rx="10" class="inner"/>
  <text x="1090" y="452" class="h">Scan / paste code</text><text x="1090" y="480" class="b">Phone camera link or paste</text><text x="1090" y="503" class="s">camera scanner (html5-qrcode) planned</text>
  <rect x="1466" y="420" width="370" height="96" rx="10" class="inner"/>
  <text x="1482" y="452" class="h">Verify seal + decode</text><text x="1482" y="480" class="b">Web Crypto HMAC check</text><text x="1482" y="503" class="s">edited marks → rejected</text>
  <rect x="1074" y="530" width="370" height="96" rx="10" class="inner"/>
  <text x="1090" y="562" class="h">Bottleneck engine</text><text x="1090" y="590" class="b">walks the prerequisite graph</text><text x="1090" y="613" class="s">→ first skill the child is stuck on</text>
  <rect x="1466" y="530" width="370" height="96" rx="10" class="inner"/>
  <text x="1482" y="562" class="h">Start Here Tomorrow</text><text x="1482" y="590" class="b">15-min activity + peer group</text><text x="1482" y="613" class="s">in the new teacher's language</text>
  <rect x="1074" y="640" width="370" height="126" rx="10" class="planin"/>
  <text x="1090" y="672" class="h">Oral check in mother tongue</text><text x="1090" y="700" class="b">plays origin-language clip</text><text x="1090" y="723" class="s">ElevenLabs voice, offline</text>
  <rect x="1466" y="640" width="370" height="126" rx="10" class="planin"/>
  <text x="1482" y="672" class="h">Sync outbox</text><text x="1482" y="700" class="b">IndexedDB queue (idb-keyval)</text><text x="1482" y="723" class="s">anonymous events only</text>

  <!-- CLOUD (planned) -->
  <rect x="60" y="830" width="1800" height="200" rx="18" class="plan"/>
  <text x="1010" y="868" class="h">When online (planned · AWS free tier · anonymous only)</text>

  <rect x="84" y="890" width="400" height="110" rx="10" class="planin"/>
  <text x="100" y="925" class="h">ElevenLabs TTS API</text><text x="100" y="953" class="b">build time only: text → mp3</text><text x="100" y="978" class="s">clips bundled into the app</text>

  <rect x="560" y="890" width="380" height="110" rx="10" class="planin"/>
  <text x="576" y="925" class="h">AWS Lambda</text><text x="576" y="953" class="b">Function URL · Node.js</text><text x="576" y="978" class="s">POST /sync · GET /stats</text>

  <rect x="1010" y="890" width="380" height="110" rx="10" class="planin"/>
  <text x="1026" y="925" class="h">Amazon DynamoDB</text><text x="1026" y="953" class="b">transfer events table</text><text x="1026" y="978" class="s">no names, no personal data</text>

  <rect x="1460" y="890" width="376" height="110" rx="10" class="planin"/>
  <text x="1476" y="925" class="h">District dashboard</text><text x="1476" y="953" class="b">migration routes +</text><text x="1476" y="978" class="s">most common skill gaps</text>

  <path d="M942,945 L1004,945" class="ard"/>
  <path d="M1392,945 L1454,945" class="ard"/>
  <!-- outbox -> lambda -->
  <path d="M1650,768 L1650,812 L750,812 L750,884" class="ard"/>
  <!-- elevenlabs -> voice pack on Phone A -->
  <path d="M284,888 L284,812 L535,812 L535,772" class="ard"/>
</svg>
</body></html>
